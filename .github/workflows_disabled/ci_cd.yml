name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8 / black / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install flake8 black mypy
      - run: flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503
      - run: black --check src/ tests/
      - run: mypy src/ --ignore-missing-imports

  test:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install numpy pandas pytest psutil
      - run: pytest tests/unit/ tests/integration/ -v --tb=short

  lean:
    name: Lean 4 Proofs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install elan / Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Compile lean_oracle
        run: |
          cd lean_oracle
          lake build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install bandit safety
      - run: bandit -r src/ -ll -q
      - run: safety check --full-report || true   # advisory only, don't fail build
