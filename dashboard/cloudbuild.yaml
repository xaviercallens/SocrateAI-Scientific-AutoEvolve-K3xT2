steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/k3t2-dashboard:$BUILD_ID'
      - '-f'
      - 'dashboard/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/k3t2-dashboard:$BUILD_ID']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - k3t2-dashboard
      - '--image=gcr.io/$PROJECT_ID/k3t2-dashboard:$BUILD_ID'
      - '--region=us-east4'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--set-env-vars=GCS_BUCKET=socrateai-datalake-gen-lang-client-0625573011'

images:
  - 'gcr.io/$PROJECT_ID/k3t2-dashboard:$BUILD_ID'
